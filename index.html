  <style>
    :root {
      --bg: #0B0F19;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --accent: #3B82F6;
      --border: rgba(248, 250, 252, 0.15);
      --font-display: 'Syne', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-display);
      overflow-x: hidden;
      overflow-y: auto;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      /* Added more padding to the body */
      padding: 30px 24px;
    }

    /* Accessibility: Skip Link */
    .skip-link {
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: #fff;
      padding: 10px 20px;
      border-radius: 0 0 8px 8px;
      z-index: 9999;
      text-decoration: none;
      font-family: var(--font-mono);
      transition: top 0.3s ease;
    }

    .skip-link:focus {
      top: 0;
    }

    /* Background Canvas */
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .noise {
      position: fixed;
      inset: 0;
      background: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.05"/%3E%3C/svg%3E');
      z-index: 1;
      pointer-events: none;
    }

    /* Layout Container - Made narrower and added internal padding */
    .container {
      width: 100%;
      max-width: 750px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 10;
      gap: 30px;
      padding: 20px 10px;
      margin: auto;
    }

    h1 {
      /* Adjusted base font size */
      font-size: clamp(2rem, 8vw, 5.5rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: var(--text-main);
      width: 100%;
    }

    h1 .outline {
      color: transparent;
      -webkit-text-stroke: 2px var(--text-main);
    }

    /* Force POURGHANNAD to stay on one line */
    .nowrap-name {
      display: block;
      white-space: nowrap;
    }

    .subtitle {
      font-family: var(--font-mono);
      font-size: clamp(0.75rem, 2vw, 0.95rem);
      color: var(--text-muted);
      line-height: 1.8;
      margin-top: 10px;
      padding: 0 10px;
    }

    .subtitle .motto {
      color: var(--accent);
      display: block;
      margin-top: 8px;
      font-weight: 700;
    }

    .action-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 35px;
      margin-top: 10px;
      width: 100%;
    }

    /* Social Links */
    .socials {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
      padding: 0 10px;
    }

    .socials a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 1px solid var(--border);
      color: var(--text-muted);
      text-decoration: none;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(5px);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .socials a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .socials a:hover {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 15px 25px rgba(59, 130, 246, 0.3);
    }

    .socials svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Creative Shutter Button */
    .btn-creative {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 280px;
      height: 60px;
      border: 1px solid var(--text-main);
      color: var(--text-main);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      overflow: hidden;
      border-radius: 4px;
      background: transparent;
      transition: border-color 0.4s ease;
    }

    .btn-creative:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .btn-creative::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent);
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
      z-index: 1;
    }

    .btn-text-top,
    .btn-text-bottom {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
      z-index: 2;
    }

    .btn-text-bottom {
      transform: translateY(100%);
      color: #fff;
      font-weight: 700;
    }

    .btn-creative:hover {
      border-color: var(--accent);
    }

    .btn-creative:hover::before {
      transform: scaleY(1);
      transform-origin: top;
    }

    .btn-creative:hover .btn-text-top {
      transform: translateY(-100%);
    }

    .btn-creative:hover .btn-text-bottom {
      transform: translateY(0);
    }

    /* Easter Egg Terminal */
    .terminal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 25, 0.9);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      padding: 15px;
    }

    .terminal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .terminal {
      width: 100%;
      max-width: 700px;
      background: #000;
      border: 1px solid var(--accent);
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(59, 130, 246, 0.2);
      font-family: var(--font-mono);
      overflow: hidden;
      transform: translateY(20px) scale(0.95);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
    }

    .terminal-overlay.active .terminal {
      transform: translateY(0) scale(1);
    }

    .term-header {
      background: #111;
      padding: 12px 15px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }

    .term-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .term-dot.red {
      background: #ff5f56;
    }

    .term-dot.yellow {
      background: #ffbd2e;
    }

    .term-dot.green {
      background: #27c93f;
    }

    .term-body {
      padding: 20px;
      color: #38BDF8;
      font-size: clamp(0.75rem, 2vw, 0.95rem);
      line-height: 1.7;
      text-align: left;
      word-break: break-word;
      max-height: 70vh;
      overflow-y: auto;
    }

    .blinking-cursor {
      display: inline-block;
      width: 10px;
      height: 18px;
      background-color: #38BDF8;
      animation: blink 1s step-end infinite;
      vertical-align: bottom;
      margin-left: 5px;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    /* Accessibility: Prefers Reduced Motion */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }

      #bg-canvas {
        display: none;
      }
    }

    /* --- RESPONSIVE DESIGN TWEAKS --- */

    @media (max-width: 768px) {
      .container {
        gap: 25px;
      }

      .action-area {
        gap: 25px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 16px;
      }

      .container {
        gap: 20px;
      }

      h1 {
        -webkit-text-stroke: 1.5px var(--text-main);
      }

      .socials a {
        width: 45px;
        height: 45px;
      }

      .btn-creative {
        height: 55px;
        font-size: 0.75rem;
      }
    }

    /* Ultra-Small Screens (Down to 320px) */
    @media (max-width: 360px) {
      body {
        padding: 15px 12px;
      }

      .container {
        gap: 15px;
      }

      h1 {
        -webkit-text-stroke: 1px var(--text-main);
      }

      .subtitle {
        font-size: 0.7rem;
        line-height: 1.6;
      }

      .socials {
        gap: 10px;
      }

      .socials a {
        width: 40px;
        height: 40px;
      }

      .socials svg {
        width: 16px;
        height: 16px;
      }

      .btn-creative {
        height: 50px;
        font-size: 0.7rem;
        max-width: 100%;
      }

      .term-body {
        font-size: 0.7rem;
        padding: 12px;
      }

      .term-header {
        padding: 8px 10px;
      }

      .term-dot {
        width: 8px;
        height: 8px;
      }
    }

    /* Landscape Mode on Mobile */
    @media (max-height: 500px) and (orientation: landscape) {
      .container {
        padding: 10px 0;
        gap: 10px;
      }

      .action-area {
        gap: 15px;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
      }

      .socials {
        width: auto;
      }

      .btn-creative {
        max-width: 200px;
        height: 45px;
      }

      .term-body {
        max-height: 50vh;
      }
    }
  </style>
</head>

  <script>
    // --- 1. BULLETPROOF TEXT SCALING (ENSURES POURGHANNAD NEVER WRAPS) ---
    function adjustTitleSize() {
      const h1 = document.getElementById('main-title');
      const container = document.querySelector('.container');

      // Reset font size to allow CSS clamp to take effect initially
      h1.style.fontSize = '';

      // Get the computed font size (based on vw/clamp)
      let currentSize = parseFloat(window.getComputedStyle(h1).fontSize);

      // If the content overflows the container, scale down pixel by pixel
      while (h1.scrollWidth > container.clientWidth && currentSize > 12) {
        currentSize -= 1;
        h1.style.fontSize = currentSize + 'px';
      }
    }

    window.addEventListener('resize', adjustTitleSize);
    window.addEventListener('load', adjustTitleSize);
    // Run once on init
    setTimeout(adjustTitleSize, 100); // Slight delay to ensure fonts are loaded


    // --- 2. SMOOTHER INTERACTIVE CONSTELLATION BACKGROUND ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];
    let animationFrameId;

    const mouse = { x: -1000, y: -1000, targetX: -1000, targetY: -1000 };

    const dotSpacing = 45;
    const baseDotSize = 1.5;
    const pushRadius = 150;

    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function initCanvas() {
      if (prefersReducedMotion) return;

      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      particles = [];

      for (let x = 0; x < width; x += dotSpacing) {
        for (let y = 0; y < height; y += dotSpacing) {
          particles.push({
            x: x, y: y, baseX: x, baseY: y, targetX: x, targetY: y,
            size: baseDotSize,
            color: 'rgba(255, 255, 255, 0.4)'
          });
        }
      }
    }

    window.addEventListener('mousemove', (e) => {
      mouse.targetX = e.clientX;
      mouse.targetY = e.clientY;
    });

    window.addEventListener('touchmove', (e) => {
      mouse.targetX = e.touches[0].clientX;
      mouse.targetY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('mouseleave', () => { mouse.targetX = -1000; mouse.targetY = -1000; });
    window.addEventListener('touchend', () => { mouse.targetX = -1000; mouse.targetY = -1000; });

    function animateBackground() {
      if (prefersReducedMotion) return;
      ctx.clearRect(0, 0, width, height);

      mouse.x += (mouse.targetX - mouse.x) * 0.1;
      mouse.y += (mouse.targetY - mouse.y) * 0.1;

      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const p1 = particles[i];
          const p2 = particles[j];
          const dx = p1.x - p2.x;
          const dy = p1.y - p2.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 90) {
            const mouseDist1 = Math.sqrt((p1.x - mouse.x) ** 2 + (p1.y - mouse.y) ** 2);
            const mouseDist2 = Math.sqrt((p2.x - mouse.x) ** 2 + (p2.y - mouse.y) ** 2);

            if (mouseDist1 < 300 || mouseDist2 < 300) {
              ctx.beginPath();
              ctx.moveTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
              const opacity = (1 - dist / 90) * 0.4;
              ctx.strokeStyle = `rgba(59, 130, 246, ${opacity})`;
              ctx.lineWidth = 1;
              ctx.stroke();
            }
          }
        }
      }

      particles.forEach(p => {
        const dx = mouse.x - p.baseX;
        const dy = mouse.y - p.baseY;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < pushRadius && distance > 0) {
          const forceDirectionX = dx / distance;
          const forceDirectionY = dy / distance;
          const force = (pushRadius - distance) / pushRadius;

          const pushX = forceDirectionX * force * 30;
          const pushY = forceDirectionY * force * 30;

          p.targetX = p.baseX + pushX;
          p.targetY = p.baseY + pushY;

          p.color = `rgba(59, 130, 246, ${0.4 + force * 0.6})`;
          p.size = baseDotSize + (3 * force);
        } else {
          p.targetX = p.baseX;
          p.targetY = p.baseY;
          p.color = 'rgba(255, 255, 255, 0.4)';
          p.size = baseDotSize;
        }

        p.x += (p.targetX - p.x) * 0.1;
        p.y += (p.targetY - p.y) * 0.1;

        if (p.size > 0) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();
        }
      });

      animationFrameId = requestAnimationFrame(animateBackground);
    }

    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        cancelAnimationFrame(animationFrameId);
        initCanvas();
        animateBackground();
      }, 200);
    });

    if (!prefersReducedMotion) {
      initCanvas();
      animateBackground();
    }

    // --- 3. EASTER EGG (Terminal Override) ---
    const overlay = document.getElementById('terminal-overlay');
    const termBody = document.getElementById('term-body');

    let isHacked = false;
    let keyBuffer = "";

    document.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      keyBuffer += e.key;
      if (keyBuffer.length > 4) keyBuffer = keyBuffer.slice(1);

      if (keyBuffer.toLowerCase() === "sudo") activateEgg();
    });

    function activateEgg() {
      if (isHacked) return;
      isHacked = true;

      overlay.classList.add('active');
      overlay.setAttribute('aria-hidden', 'false');

      const lines = [
        "System override initiated...",
        "Bypassing security protocols...",
        "Accessing user data...",
        "\n> Name: MohammadHasan Pourghannad",
        "> Role: Senior Front-End Developer",
        "> Skills: HTML, CSS, JS, Node.js, Architecture",
        "\n> You found the easter egg.",
        "> You clearly pay attention to detail.",
        "> Let's build something amazing together.",
        "\n> Contact: hasan@pourghannad.ir",
        "\n> System shutting down in 3... 2... 1..."
      ];

      let currentLine = 0;
      let currentChar = 0;
      let textHTML = "";

      function type() {
        if (currentLine < lines.length) {
          if (currentChar < lines[currentLine].length) {
            textHTML += lines[currentLine].charAt(currentChar);
            termBody.innerHTML = textHTML + '<span class="blinking-cursor" aria-hidden="true"></span>';
            currentChar++;
            // Scroll to bottom as it types
            termBody.scrollTop = termBody.scrollHeight;
            setTimeout(type, Math.random() * 40 + 10);
          } else {
            textHTML += "<br>";
            currentLine++;
            currentChar = 0;
            setTimeout(type, 400);
          }
        } else {
          setTimeout(() => {
            overlay.classList.remove('active');
            overlay.setAttribute('aria-hidden', 'true');

            setTimeout(() => {
              isHacked = false;
              termBody.innerHTML = "";
              textHTML = "";
            }, 500);
          }, 4000);
        }
      }

      setTimeout(type, 500);
    }
  </script>
